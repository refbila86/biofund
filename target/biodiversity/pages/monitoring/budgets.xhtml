<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core"
	xmlns:ui="jakarta.faces.facelets" xmlns:p="http://primefaces.org/ui"
	template="/WEB-INF/views/templates/main-template.xhtml">
	<ui:define name="title">Orçamento da Acção</ui:define>

	<ui:define name="content">
		<h2>Orçamento da Acção</h2>

		<h:form id="listForm">
			<p:toolbar styleClass="mb-2">
				<p:toolbarGroup>
					<p:commandButton value="Novo" icon="pi pi-plus" process="@this"
						actionListener="#{actionBudgetBean.prepareNew}"
						update=":editForm:fields" oncomplete="PF('editDlg').show()" />
				</p:toolbarGroup>
			</p:toolbar>

			<p:dataTable id="table" var="item" value="#{actionBudgetBean.items}"
				rowKey="#{item.id}" paginator="true" rows="10"
				rowsPerPageTemplate="10,25,50" emptyMessage="Sem registos."
				reflow="true">
				<p:column headerText="ID" sortBy="#{item.id}" width="70">
					<h:outputText value="#{item.id}" />
				</p:column>
				<p:column headerText="Acção (ID)" sortBy="#{item.action_id}">
					<h:outputText value="#{item.action_id}" />
				</p:column>
				<p:column headerText="Financiamento Fonte (ID)"
					sortBy="#{item.funding_source_id}">
					<h:outputText value="#{item.funding_source_id}" />
				</p:column>
				<p:column headerText="Fiscal Ano" sortBy="#{item.fiscal_year}">
					<h:outputText value="#{item.fiscal_year}" />
				</p:column>
				<p:column headerText="Aprovado Montante"
					sortBy="#{item.approved_amount}">
					<h:outputText value="#{item.approved_amount}" />
				</p:column>
				<p:column headerText="Revisto Montante"
					sortBy="#{item.revised_amount}">
					<h:outputText value="#{item.revised_amount}" />
				</p:column>
				<p:column headerText="Moeda" sortBy="#{item.currency}">
					<h:outputText value="#{item.currency}" />
				</p:column>
				<p:column headerText="Acções" width="110" exportable="false">
					<p:commandButton icon="pi pi-pencil" title="Editar" process="@this"
						update=":editForm:fields" oncomplete="PF('editDlg').show()">
						<f:setPropertyActionListener value="#{item}"
							target="#{actionBudgetBean.selected}" />
					</p:commandButton>
					<p:commandButton icon="pi pi-trash" title="Eliminar"
						process="@this" update="table" styleClass="ui-button-danger"
						action="#{actionBudgetBean.delete(item.id)}">
						<p:confirm header="Confirmação" message="Eliminar este registo?"
							icon="pi pi-exclamation-triangle" />
					</p:commandButton>
				</p:column>
			</p:dataTable>
		</h:form>

		<p:dialog id="editDlg" widgetVar="editDlg" header="Orçamento da Acção"
			modal="true" resizable="false" closeOnEscape="true" responsive="true"
			width="640">
			<h:form id="editForm">
				<p:panelGrid id="fields" columns="2" layout="grid"
					styleClass="ui-fluid"
					columnClasses="col-12 md:col-4,col-12 md:col-8">
					<p:outputLabel for="f_action_id" value="Acção (ID)" />
					<p:inputNumber id="f_action_id"
						value="#{actionBudgetBean.selected.action_id}" decimalPlaces="0"
						thousandSeparator="" />
					<p:outputLabel for="f_funding_source_id"
						value="Financiamento Fonte (ID)" />
					<p:inputNumber id="f_funding_source_id"
						value="#{actionBudgetBean.selected.funding_source_id}"
						decimalPlaces="0" thousandSeparator="" />
					<p:outputLabel for="f_fiscal_year" value="Fiscal Ano" />
					<p:inputNumber id="f_fiscal_year"
						value="#{actionBudgetBean.selected.fiscal_year}" decimalPlaces="0"
						thousandSeparator="" />
					<p:outputLabel for="f_approved_amount" value="Aprovado Montante" />
					<p:inputNumber id="f_approved_amount"
						value="#{actionBudgetBean.selected.approved_amount}"
						decimalPlaces="2" decimalSeparator="," thousandSeparator="." />
					<p:outputLabel for="f_revised_amount" value="Revisto Montante" />
					<p:inputNumber id="f_revised_amount"
						value="#{actionBudgetBean.selected.revised_amount}"
						decimalPlaces="2" decimalSeparator="," thousandSeparator="." />
					<p:outputLabel for="f_currency" value="Moeda" />
					<p:inputText id="f_currency"
						value="#{actionBudgetBean.selected.currency}" />
					<p:outputLabel for="f_budget_classifier"
						value="Orçamento Classificador" />
					<p:inputText id="f_budget_classifier"
						value="#{actionBudgetBean.selected.budget_classifier}" />
					<p:outputLabel for="f_planning_instrument"
						value="Planeamento Instrumento" />
					<p:inputText id="f_planning_instrument"
						value="#{actionBudgetBean.selected.planning_instrument}" />
					<p:outputLabel for="f_version" value="Versão" />
					<p:inputNumber id="f_version"
						value="#{actionBudgetBean.selected.version}" decimalPlaces="0"
						thousandSeparator="" />
					<p:outputLabel for="f_current_version" value="Actual Versão" />
					<p:selectBooleanCheckbox id="f_current_version"
						value="#{actionBudgetBean.selected.current_version}" />
					<p:outputLabel for="f_updated_por" value="Actualizado Por" />
					<p:inputNumber id="f_updated_por"
						value="#{actionBudgetBean.selected.updated_por}" decimalPlaces="0"
						thousandSeparator="" />
				</p:panelGrid>
				<div class="dialog-actions">
					<p:commandButton value="Guardar" icon="pi pi-check" process="@form"
						actionListener="#{actionBudgetBean.save}"
						update="fields :listForm:table :growl"
						oncomplete="if (!args.validationFailed) PF('editDlg').hide()" />
					<p:commandButton value="Cancelar" icon="pi pi-times" type="button"
						styleClass="ui-button-flat" onclick="PF('editDlg').hide()" />
				</div>
			</h:form>
		</p:dialog>
	</ui:define>
</ui:composition>
