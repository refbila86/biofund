<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core"
	xmlns:ui="jakarta.faces.facelets" xmlns:p="http://primefaces.org/ui"
	template="/WEB-INF/views/templates/main-template.xhtml">
	<ui:define name="title">Acções</ui:define>

	<ui:define name="content">
		<h2>Acções</h2>

		<h:form id="listForm">
			<p:toolbar styleClass="mb-2">
				<p:toolbarGroup>
					<p:commandButton value="Novo" icon="pi pi-plus" process="@this"
						actionListener="#{actionBean.prepareNew}"
						update=":editForm:fields" oncomplete="PF('editDlg').show()" />
				</p:toolbarGroup>
			</p:toolbar>

			<p:dataTable id="table" var="item" value="#{actionBean.items}"
				rowKey="#{item.id}" paginator="true" rows="10"
				rowsPerPageTemplate="10,25,50" emptyMessage="Sem registos."
				reflow="true">
				<p:column headerText="ID" sortBy="#{item.id}" width="70">
					<h:outputText value="#{item.id}" />
				</p:column>
				<p:column headerText="Projecto (ID)" sortBy="#{item.project_id}">
					<h:outputText value="#{item.project_id}" />
				</p:column>
				<p:column headerText="Instituição (ID)"
					sortBy="#{item.institution_id}">
					<h:outputText value="#{item.institution_id}" />
				</p:column>
				<p:column headerText="Intervenção Tipo (ID)"
					sortBy="#{item.intervention_type_id}">
					<h:outputText value="#{item.intervention_type_id}" />
				</p:column>
				<p:column headerText="Acção Estado (ID)"
					sortBy="#{item.action_status_id}">
					<h:outputText value="#{item.action_status_id}" />
				</p:column>
				<p:column headerText="Código" sortBy="#{item.code}">
					<h:outputText value="#{item.code}" />
				</p:column>
				<p:column headerText="Título" sortBy="#{item.title}">
					<h:outputText value="#{item.title}" />
				</p:column>
				<p:column headerText="Acções" width="110" exportable="false">
					<p:commandButton icon="pi pi-pencil" title="Editar" process="@this"
						update=":editForm:fields" oncomplete="PF('editDlg').show()">
						<f:setPropertyActionListener value="#{item}"
							target="#{actionBean.selected}" />
					</p:commandButton>
					<p:commandButton icon="pi pi-trash" title="Eliminar"
						process="@this" update="table" styleClass="ui-button-danger"
						action="#{actionBean.delete(item.id)}">
						<p:confirm header="Confirmação" message="Eliminar este registo?"
							icon="pi pi-exclamation-triangle" />
					</p:commandButton>
				</p:column>
			</p:dataTable>
		</h:form>

		<p:dialog id="editDlg" widgetVar="editDlg" header="Acções"
			modal="true" resizable="false" closeOnEscape="true" responsive="true"
			width="640">
			<h:form id="editForm">
				<p:panelGrid id="fields" columns="2" layout="grid"
					styleClass="ui-fluid"
					columnClasses="col-12 md:col-4,col-12 md:col-8">
					<p:outputLabel for="f_project_id" value="Projecto (ID)" />
					<p:inputNumber id="f_project_id"
						value="#{actionBean.selected.project_id}" decimalPlaces="0"
						thousandSeparator="" />
					<p:outputLabel for="f_institution_id" value="Instituição (ID)" />
					<p:inputNumber id="f_institution_id"
						value="#{actionBean.selected.institution_id}" decimalPlaces="0"
						thousandSeparator="" />
					<p:outputLabel for="f_intervention_type_id"
						value="Intervenção Tipo (ID)" />
					<p:inputNumber id="f_intervention_type_id"
						value="#{actionBean.selected.intervention_type_id}"
						decimalPlaces="0" thousandSeparator="" />
					<p:outputLabel for="f_action_status_id" value="Acção Estado (ID)" />
					<p:inputNumber id="f_action_status_id"
						value="#{actionBean.selected.action_status_id}" decimalPlaces="0"
						thousandSeparator="" />
					<p:outputLabel for="f_code" value="Código" />
					<p:inputText id="f_code" value="#{actionBean.selected.code}" />
					<p:outputLabel for="f_title" value="Título" />
					<p:inputText id="f_title" value="#{actionBean.selected.title}" />
					<p:outputLabel for="f_description" value="Descrição" />
					<p:inputTextarea id="f_description"
						value="#{actionBean.selected.description}" rows="3"
						autoResize="false" />
					<p:outputLabel for="f_implementing_unit"
						value="Implementadora Unidade" />
					<p:inputText id="f_implementing_unit"
						value="#{actionBean.selected.implementing_unit}" />
					<p:outputLabel for="f_start_date" value="Início Data" />
					<p:datePicker id="f_start_date"
						value="#{actionBean.selected.start_date}" pattern="dd/MM/yyyy"
						showIcon="true" />
					<p:outputLabel for="f_planned_end_date" value="Planeada Fim Data" />
					<p:datePicker id="f_planned_end_date"
						value="#{actionBean.selected.planned_end_date}"
						pattern="dd/MM/yyyy" showIcon="true" />
					<p:outputLabel for="f_actual_end_date" value="Real Fim Data" />
					<p:datePicker id="f_actual_end_date"
						value="#{actionBean.selected.actual_end_date}"
						pattern="dd/MM/yyyy" showIcon="true" />
					<p:outputLabel for="f_reference_currency" value="Referência Moeda" />
					<p:inputText id="f_reference_currency"
						value="#{actionBean.selected.reference_currency}" />
					<p:outputLabel for="f_created_by_id" value="Criado por (ID)" />
					<p:inputNumber id="f_created_by_id"
						value="#{actionBean.selected.created_by_id}" decimalPlaces="0"
						thousandSeparator="" />
				</p:panelGrid>
				<div class="dialog-actions">
					<p:commandButton value="Guardar" icon="pi pi-check" process="@form"
						actionListener="#{actionBean.save}"
						update="fields :listForm:table :growl"
						oncomplete="if (!args.validationFailed) PF('editDlg').hide()" />
					<p:commandButton value="Cancelar" icon="pi pi-times" type="button"
						styleClass="ui-button-flat" onclick="PF('editDlg').hide()" />
				</div>
			</h:form>
		</p:dialog>
	</ui:define>
</ui:composition>
