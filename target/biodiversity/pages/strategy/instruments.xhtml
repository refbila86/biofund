<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core"
	xmlns:ui="jakarta.faces.facelets" xmlns:p="http://primefaces.org/ui"
	template="/WEB-INF/views/templates/main-template.xhtml">
	<ui:define name="title">Instrumentos Estratégicos</ui:define>

	<ui:define name="content">
		<h2>Instrumentos Estratégicos</h2>

		<h:form id="listForm">
			<p:toolbar styleClass="mb-2">
				<p:toolbarGroup>
					<p:commandButton value="Novo" icon="pi pi-plus" process="@this"
						actionListener="#{strategicInstrumentBean.prepareNew}"
						update=":editForm:fields" oncomplete="PF('editDlg').show()" />
				</p:toolbarGroup>
			</p:toolbar>

			<p:dataTable id="table" var="item"
				value="#{strategicInstrumentBean.items}" rowKey="#{item.id}"
				paginator="true" rows="10" rowsPerPageTemplate="10,25,50"
				emptyMessage="Sem registos." reflow="true">
				<p:column headerText="ID" sortBy="#{item.id}" width="70">
					<h:outputText value="#{item.id}" />
				</p:column>
				<p:column headerText="Sigla" sortBy="#{item.acronym}">
					<h:outputText value="#{item.acronym}" />
				</p:column>
				<p:column headerText="Nome" sortBy="#{item.name}">
					<h:outputText value="#{item.name}" />
				</p:column>
				<p:column headerText="Período Início" sortBy="#{item.period_start}">
					<h:outputText value="#{item.period_start}" />
				</p:column>
				<p:column headerText="Período Fim" sortBy="#{item.period_end}">
					<h:outputText value="#{item.period_end}" />
				</p:column>
				<p:column headerText="Activo" sortBy="#{item.active}">
					<h:outputText value="#{item.active ? 'Sim' : 'Não'}" />
				</p:column>
				<p:column headerText="Acções" width="110" exportable="false">
					<p:commandButton icon="pi pi-pencil" title="Editar" process="@this"
						update=":editForm:fields" oncomplete="PF('editDlg').show()">
						<f:setPropertyActionListener value="#{item}"
							target="#{strategicInstrumentBean.selected}" />
					</p:commandButton>
					<p:commandButton icon="pi pi-trash" title="Eliminar"
						process="@this" update="table" styleClass="ui-button-danger"
						action="#{strategicInstrumentBean.delete(item.id)}">
						<p:confirm header="Confirmação" message="Eliminar este registo?"
							icon="pi pi-exclamation-triangle" />
					</p:commandButton>
				</p:column>
			</p:dataTable>
		</h:form>

		<p:dialog id="editDlg" widgetVar="editDlg"
			header="Instrumentos Estratégicos" modal="true" resizable="false"
			closeOnEscape="true" responsive="true" width="640">
			<h:form id="editForm">
				<p:panelGrid id="fields" columns="2" layout="grid"
					styleClass="ui-fluid"
					columnClasses="col-12 md:col-4,col-12 md:col-8">
					<p:outputLabel for="f_acronym" value="Sigla" />
					<p:inputText id="f_acronym"
						value="#{strategicInstrumentBean.selected.acronym}" />
					<p:outputLabel for="f_name" value="Nome" />
					<p:inputText id="f_name"
						value="#{strategicInstrumentBean.selected.name}" />
					<p:outputLabel for="f_period_start" value="Período Início" />
					<p:datePicker id="f_period_start"
						value="#{strategicInstrumentBean.selected.period_start}"
						pattern="dd/MM/yyyy" showIcon="true" />
					<p:outputLabel for="f_period_end" value="Período Fim" />
					<p:datePicker id="f_period_end"
						value="#{strategicInstrumentBean.selected.period_end}"
						pattern="dd/MM/yyyy" showIcon="true" />
					<p:outputLabel for="f_description" value="Descrição" />
					<p:inputTextarea id="f_description"
						value="#{strategicInstrumentBean.selected.description}" rows="3"
						autoResize="false" />
					<p:outputLabel for="f_active" value="Activo" />
					<p:selectBooleanCheckbox id="f_active"
						value="#{strategicInstrumentBean.selected.active}" />
				</p:panelGrid>
				<div class="dialog-actions">
					<p:commandButton value="Guardar" icon="pi pi-check" process="@form"
						actionListener="#{strategicInstrumentBean.save}"
						update="fields :listForm:table :growl"
						oncomplete="if (!args.validationFailed) PF('editDlg').hide()" />
					<p:commandButton value="Cancelar" icon="pi pi-times" type="button"
						styleClass="ui-button-flat" onclick="PF('editDlg').hide()" />
				</div>
			</h:form>
		</p:dialog>
	</ui:define>
</ui:composition>
