<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core"
	xmlns:ui="jakarta.faces.facelets" xmlns:p="http://primefaces.org/ui"
	template="/WEB-INF/views/templates/main-template.xhtml">
	<ui:define name="title">Metas por Período</ui:define>

	<ui:define name="content">
		<h2>Metas por Período</h2>

		<h:form id="listForm">
			<p:toolbar styleClass="mb-2">
				<p:toolbarGroup>
					<p:commandButton value="Novo" icon="pi pi-plus" process="@this"
						actionListener="#{indicatorTargetPeriodBean.prepareNew}"
						update=":editForm:fields" oncomplete="PF('editDlg').show()" />
				</p:toolbarGroup>
			</p:toolbar>

			<p:dataTable id="table" var="item"
				value="#{indicatorTargetPeriodBean.items}" rowKey="#{item.id}"
				paginator="true" rows="10" rowsPerPageTemplate="10,25,50"
				emptyMessage="Sem registos." reflow="true">
				<p:column headerText="ID" sortBy="#{item.id}" width="70">
					<h:outputText value="#{item.id}" />
				</p:column>
				<p:column headerText="Indicador (ID)" sortBy="#{item.indicator_id}">
					<h:outputText value="#{item.indicator_id}" />
				</p:column>
				<p:column headerText="Ano" sortBy="#{item.year}">
					<h:outputText value="#{item.year}" />
				</p:column>
				<p:column headerText="Linha de base Valor"
					sortBy="#{item.baseline_value}">
					<h:outputText value="#{item.baseline_value}" />
				</p:column>
				<p:column headerText="Linha de base Ano"
					sortBy="#{item.baseline_year}">
					<h:outputText value="#{item.baseline_year}" />
				</p:column>
				<p:column headerText="Meta Valor" sortBy="#{item.target_value}">
					<h:outputText value="#{item.target_value}" />
				</p:column>
				<p:column headerText="Acções" width="110" exportable="false">
					<p:commandButton icon="pi pi-pencil" title="Editar" process="@this"
						update=":editForm:fields" oncomplete="PF('editDlg').show()">
						<f:setPropertyActionListener value="#{item}"
							target="#{indicatorTargetPeriodBean.selected}" />
					</p:commandButton>
					<p:commandButton icon="pi pi-trash" title="Eliminar"
						process="@this" update="table" styleClass="ui-button-danger"
						action="#{indicatorTargetPeriodBean.delete(item.id)}">
						<p:confirm header="Confirmação" message="Eliminar este registo?"
							icon="pi pi-exclamation-triangle" />
					</p:commandButton>
				</p:column>
			</p:dataTable>
		</h:form>

		<p:dialog id="editDlg" widgetVar="editDlg" header="Metas por Período"
			modal="true" resizable="false" closeOnEscape="true" responsive="true"
			width="640">
			<h:form id="editForm">
				<p:panelGrid id="fields" columns="2" layout="grid"
					styleClass="ui-fluid"
					columnClasses="col-12 md:col-4,col-12 md:col-8">
					<p:outputLabel for="f_indicator_id" value="Indicador (ID)" />
					<p:inputNumber id="f_indicator_id"
						value="#{indicatorTargetPeriodBean.selected.indicator_id}"
						decimalPlaces="0" thousandSeparator="" />
					<p:outputLabel for="f_year" value="Ano" />
					<p:inputNumber id="f_year"
						value="#{indicatorTargetPeriodBean.selected.year}"
						decimalPlaces="0" thousandSeparator="" />
					<p:outputLabel for="f_baseline_value" value="Linha de base Valor" />
					<p:inputNumber id="f_baseline_value"
						value="#{indicatorTargetPeriodBean.selected.baseline_value}"
						decimalPlaces="2" decimalSeparator="," thousandSeparator="." />
					<p:outputLabel for="f_baseline_year" value="Linha de base Ano" />
					<p:inputNumber id="f_baseline_year"
						value="#{indicatorTargetPeriodBean.selected.baseline_year}"
						decimalPlaces="0" thousandSeparator="" />
					<p:outputLabel for="f_target_value" value="Meta Valor" />
					<p:inputNumber id="f_target_value"
						value="#{indicatorTargetPeriodBean.selected.target_value}"
						decimalPlaces="2" decimalSeparator="," thousandSeparator="." />
					<p:outputLabel for="f_observacao" value="Observação" />
					<p:inputTextarea id="f_observacao"
						value="#{indicatorTargetPeriodBean.selected.observacao}" rows="3"
						autoResize="false" />
				</p:panelGrid>
				<div class="dialog-actions">
					<p:commandButton value="Guardar" icon="pi pi-check" process="@form"
						actionListener="#{indicatorTargetPeriodBean.save}"
						update="fields :listForm:table :growl"
						oncomplete="if (!args.validationFailed) PF('editDlg').hide()" />
					<p:commandButton value="Cancelar" icon="pi pi-times" type="button"
						styleClass="ui-button-flat" onclick="PF('editDlg').hide()" />
				</div>
			</h:form>
		</p:dialog>
	</ui:define>
</ui:composition>
