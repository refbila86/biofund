<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core"
	xmlns:ui="jakarta.faces.facelets" xmlns:p="http://primefaces.org/ui"
	template="/WEB-INF/views/templates/main-template.xhtml">
	<ui:define name="title">Indicadores</ui:define>

	<ui:define name="content">
		<h2>Indicadores</h2>

		<h:form id="listForm">
			<p:toolbar styleClass="mb-2">
				<p:toolbarGroup>
					<p:commandButton value="Novo" icon="pi pi-plus" process="@this"
						actionListener="#{indicatorBean.prepareNew}"
						update=":editForm:fields" oncomplete="PF('editDlg').show()" />
				</p:toolbarGroup>
			</p:toolbar>

			<p:dataTable id="table" var="item" value="#{indicatorBean.items}"
				rowKey="#{item.id}" paginator="true" rows="10"
				rowsPerPageTemplate="10,25,50" emptyMessage="Sem registos."
				reflow="true">
				<p:column headerText="ID" sortBy="#{item.id}" width="70">
					<h:outputText value="#{item.id}" />
				</p:column>
				<p:column headerText="Meta (ID)" sortBy="#{item.target_id}">
					<h:outputText value="#{item.target_id}" />
				</p:column>
				<p:column headerText="Dados Fonte (ID)"
					sortBy="#{item.data_source_id}">
					<h:outputText value="#{item.data_source_id}" />
				</p:column>
				<p:column headerText="Responsável Instituição (ID)"
					sortBy="#{item.responsible_institution_id}">
					<h:outputText value="#{item.responsible_institution_id}" />
				</p:column>
				<p:column headerText="Medição Unidade (ID)"
					sortBy="#{item.measurement_unit_id}">
					<h:outputText value="#{item.measurement_unit_id}" />
				</p:column>
				<p:column headerText="Código" sortBy="#{item.code}">
					<h:outputText value="#{item.code}" />
				</p:column>
				<p:column headerText="Nome" sortBy="#{item.name}">
					<h:outputText value="#{item.name}" />
				</p:column>
				<p:column headerText="Acções" width="110" exportable="false">
					<p:commandButton icon="pi pi-pencil" title="Editar" process="@this"
						update=":editForm:fields" oncomplete="PF('editDlg').show()">
						<f:setPropertyActionListener value="#{item}"
							target="#{indicatorBean.selected}" />
					</p:commandButton>
					<p:commandButton icon="pi pi-trash" title="Eliminar"
						process="@this" update="table" styleClass="ui-button-danger"
						action="#{indicatorBean.delete(item.id)}">
						<p:confirm header="Confirmação" message="Eliminar este registo?"
							icon="pi pi-exclamation-triangle" />
					</p:commandButton>
				</p:column>
			</p:dataTable>
		</h:form>

		<p:dialog id="editDlg" widgetVar="editDlg" header="Indicadores"
			modal="true" resizable="false" closeOnEscape="true" responsive="true"
			width="640">
			<h:form id="editForm">
				<p:panelGrid id="fields" columns="2" layout="grid"
					styleClass="ui-fluid"
					columnClasses="col-12 md:col-4,col-12 md:col-8">
					<p:outputLabel for="f_target_id" value="Meta (ID)" />
					<p:inputNumber id="f_target_id"
						value="#{indicatorBean.selected.target_id}" decimalPlaces="0"
						thousandSeparator="" />
					<p:outputLabel for="f_data_source_id" value="Dados Fonte (ID)" />
					<p:inputNumber id="f_data_source_id"
						value="#{indicatorBean.selected.data_source_id}" decimalPlaces="0"
						thousandSeparator="" />
					<p:outputLabel for="f_responsible_institution_id"
						value="Responsável Instituição (ID)" />
					<p:inputNumber id="f_responsible_institution_id"
						value="#{indicatorBean.selected.responsible_institution_id}"
						decimalPlaces="0" thousandSeparator="" />
					<p:outputLabel for="f_measurement_unit_id"
						value="Medição Unidade (ID)" />
					<p:inputNumber id="f_measurement_unit_id"
						value="#{indicatorBean.selected.measurement_unit_id}"
						decimalPlaces="0" thousandSeparator="" />
					<p:outputLabel for="f_code" value="Código" />
					<p:inputText id="f_code" value="#{indicatorBean.selected.code}" />
					<p:outputLabel for="f_name" value="Nome" />
					<p:inputText id="f_name" value="#{indicatorBean.selected.name}" />
					<p:outputLabel for="f_definition" value="Definição" />
					<p:inputTextarea id="f_definition"
						value="#{indicatorBean.selected.definition}" rows="3"
						autoResize="false" />
					<p:outputLabel for="f_formula" value="Fórmula" />
					<p:inputTextarea id="f_formula"
						value="#{indicatorBean.selected.formula}" rows="3"
						autoResize="false" />
					<p:outputLabel for="f_frequency" value="Frequência" />
					<p:inputText id="f_frequency"
						value="#{indicatorBean.selected.frequency}" />
					<p:outputLabel for="f_target_direction" value="Meta Direcção" />
					<p:inputText id="f_target_direction"
						value="#{indicatorBean.selected.target_direction}" />
					<p:outputLabel for="f_confidence_level" value="Confiança Nível" />
					<p:inputText id="f_confidence_level"
						value="#{indicatorBean.selected.confidence_level}" />
					<p:outputLabel for="f_collection_method" value="Recolha Método" />
					<p:inputText id="f_collection_method"
						value="#{indicatorBean.selected.collection_method}" />
					<p:outputLabel for="f_active" value="Activo" />
					<p:selectBooleanCheckbox id="f_active"
						value="#{indicatorBean.selected.active}" />
				</p:panelGrid>
				<div class="dialog-actions">
					<p:commandButton value="Guardar" icon="pi pi-check" process="@form"
						actionListener="#{indicatorBean.save}"
						update="fields :listForm:table :growl"
						oncomplete="if (!args.validationFailed) PF('editDlg').hide()" />
					<p:commandButton value="Cancelar" icon="pi pi-times" type="button"
						styleClass="ui-button-flat" onclick="PF('editDlg').hide()" />
				</div>
			</h:form>
		</p:dialog>
	</ui:define>
</ui:composition>
