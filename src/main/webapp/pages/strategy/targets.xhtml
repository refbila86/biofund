<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core"
	xmlns:ui="jakarta.faces.facelets" xmlns:p="http://primefaces.org/ui"
	template="/WEB-INF/views/templates/main-template.xhtml">
	<ui:define name="title">Metas</ui:define>

	<ui:define name="content">
		<h2>Metas</h2>

		<h:form id="listForm">
			<p:toolbar styleClass="mb-2">
				<p:toolbarGroup>
					<p:commandButton value="Novo" icon="pi pi-plus" process="@this"
						actionListener="#{targetBean.prepareNew}"
						update=":editForm:fields" oncomplete="PF('editDlg').show()" />
				</p:toolbarGroup>
			</p:toolbar>

			<p:dataTable id="table" var="item" value="#{targetBean.items}"
				rowKey="#{item.id}" paginator="true" rows="10"
				rowsPerPageTemplate="10,25,50" emptyMessage="Sem registos."
				reflow="true">
				<p:column headerText="ID" sortBy="#{item.id}" width="70">
					<h:outputText value="#{item.id}" />
				</p:column>
				<p:column headerText="Estratégico Instrumento (ID)"
					sortBy="#{item.strategic_instrument_id}">
					<h:outputText value="#{item.strategic_instrument_id}" />
				</p:column>
				<p:column headerText="Código" sortBy="#{item.code}">
					<h:outputText value="#{item.code}" />
				</p:column>
				<p:column headerText="Início Data" sortBy="#{item.start_date}">
					<h:outputText value="#{item.start_date}" />
				</p:column>
				<p:column headerText="Fim Data" sortBy="#{item.end_date}">
					<h:outputText value="#{item.end_date}" />
				</p:column>
				<p:column headerText="Activo" sortBy="#{item.active}">
					<h:outputText value="#{item.active ? 'Sim' : 'Não'}" />
				</p:column>
				<p:column headerText="Acções" width="110" exportable="false">
					<p:commandButton icon="pi pi-pencil" title="Editar" process="@this"
						update=":editForm:fields" oncomplete="PF('editDlg').show()">
						<f:setPropertyActionListener value="#{item}"
							target="#{targetBean.selected}" />
					</p:commandButton>
					<p:commandButton icon="pi pi-trash" title="Eliminar"
						process="@this" update="table" styleClass="ui-button-danger"
						action="#{targetBean.delete(item.id)}">
						<p:confirm header="Confirmação" message="Eliminar este registo?"
							icon="pi pi-exclamation-triangle" />
					</p:commandButton>
				</p:column>
			</p:dataTable>
		</h:form>

		<p:dialog id="editDlg" widgetVar="editDlg" header="Metas" modal="true"
			resizable="false" closeOnEscape="true" responsive="true" width="640">
			<h:form id="editForm">
				<p:panelGrid id="fields" columns="2" layout="grid"
					styleClass="ui-fluid"
					columnClasses="col-12 md:col-4,col-12 md:col-8">
					<p:outputLabel for="f_strategic_instrument_id"
						value="Estratégico Instrumento (ID)" />
					<p:inputNumber id="f_strategic_instrument_id"
						value="#{targetBean.selected.strategic_instrument_id}"
						decimalPlaces="0" thousandSeparator="" />
					<p:outputLabel for="f_code" value="Código" />
					<p:inputText id="f_code" value="#{targetBean.selected.code}" />
					<p:outputLabel for="f_description" value="Descrição" />
					<p:inputTextarea id="f_description"
						value="#{targetBean.selected.description}" rows="3"
						autoResize="false" />
					<p:outputLabel for="f_start_date" value="Início Data" />
					<p:datePicker id="f_start_date"
						value="#{targetBean.selected.start_date}" pattern="dd/MM/yyyy"
						showIcon="true" />
					<p:outputLabel for="f_end_date" value="Fim Data" />
					<p:datePicker id="f_end_date"
						value="#{targetBean.selected.end_date}" pattern="dd/MM/yyyy"
						showIcon="true" />
					<p:outputLabel for="f_active" value="Activo" />
					<p:selectBooleanCheckbox id="f_active"
						value="#{targetBean.selected.active}" />
				</p:panelGrid>
				<div class="dialog-actions">
					<p:commandButton value="Guardar" icon="pi pi-check" process="@form"
						actionListener="#{targetBean.save}"
						update="fields :listForm:table :growl"
						oncomplete="if (!args.validationFailed) PF('editDlg').hide()" />
					<p:commandButton value="Cancelar" icon="pi pi-times" type="button"
						styleClass="ui-button-flat" onclick="PF('editDlg').hide()" />
				</div>
			</h:form>
		</p:dialog>
	</ui:define>
</ui:composition>
