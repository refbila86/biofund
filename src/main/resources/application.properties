
# ==========================================================
# BIODIVERSITY PLATFORM
# Application Configuration
# ==========================================================

spring.application.name=biodiversity-platform

server.port=8088
server.servlet.context-parameters.jakarta.faces.FACELETS_BUFFER_SIZE=65535


# ==========================================================
# DATABASE CONFIGURATION - MYSQL
# ==========================================================

spring.datasource.url=jdbc:mysql://localhost:3306/biodiversity_platform?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Africa/Maputo

spring.datasource.username=root
spring.datasource.password=Utrafe2004@Mysql#2026

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ==========================================================
# ENVIRONMENT CONFIGURATION
# ==========================================================

# ----------------------------------------------------------
# 1. DEVELOPMENT ENVIRONMENT (CURRENTLY ACTIVE)
# ----------------------------------------------------------
# Automatically creates missing tables and updates the schema.
# Recommended during application development.

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# ----------------------------------------------------------
# 2. TEST ENVIRONMENT (FUTURE CONFIGURATION)
# ----------------------------------------------------------
# Option A: Validate entities against the existing database.
# Does not create, modify or delete database structures.
#
# spring.jpa.hibernate.ddl-auto=validate
#
# Option B: Use Flyway migrations to manage database changes.
# Enable Flyway when the migration scripts are ready.
#
# spring.flyway.enabled=true
# spring.flyway.locations=classpath:db/migration
# spring.flyway.baseline-on-migrate=true


# ----------------------------------------------------------
# 3. PRODUCTION ENVIRONMENT (FUTURE CONFIGURATION)
# ----------------------------------------------------------
# Validate the database schema without modifying it.
# Use Flyway to manage all database schema changes.
#
# spring.jpa.hibernate.ddl-auto=validate
#
# spring.flyway.enabled=true
# spring.flyway.locations=classpath:db/migration
# spring.flyway.baseline-on-migrate=true
#
# IMPORTANT:
# In production, use a dedicated database user instead of root.
# Store database credentials in environment variables.


# ==========================================================
# JPA / HIBERNATE CONFIGURATION
# ==========================================================

# MySQL dialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Database timezone
spring.jpa.properties.hibernate.jdbc.time_zone=Africa/Maputo


# ==========================================================
# HIKARI CONNECTION POOL
# ==========================================================

spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000


# ==========================================================
# JSF / PRIMEFACES CONFIGURATION
# ==========================================================

# JSF servlet URL mapping
joinfaces.faces-servlet.url-mappings=*.xhtml

# PrimeFaces theme
joinfaces.primefaces.theme=saga

# JSF development mode
joinfaces.faces.project-stage=development


# ==========================================================
# SERVER / WAR DEPLOYMENT
# ==========================================================

server.servlet.context-path=/biodiversity


# ==========================================================
# LOGGING CONFIGURATION
# ==========================================================

# Display Hibernate SQL statements
logging.level.org.hibernate.SQL=DEBUG

# Display database schema generation operations
logging.level.org.hibernate.tool.schema=DEBUG

# Spring JPA logging
logging.level.org.springframework.orm.jpa=INFO


# ==========================================================
# FUTURE PRODUCTION SECURITY CONFIGURATION
# ==========================================================

# Disable detailed SQL logging in production:
# spring.jpa.show-sql=false
# logging.level.org.hibernate.SQL=WARN
# logging.level.org.hibernate.tool.schema=WARN
